name = "david-wings-ledger"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true      # every request, including the UI, goes through the Access check

[[d1_databases]]
binding = "DB"
database_name = "david-wings-ledger"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
ACCESS_TEAM = ""   # your Zero Trust team name, e.g. "davidwings"
ACCESS_AUD = ""    # the Application Audience (AUD) tag of the Access app
